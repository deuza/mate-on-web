# Mate On Web under Apache 2.4, served from /var/www/html/mate-on-web.
#
# From the root of the project:
#     cp docs/apache2/mate-on-web.conf /etc/apache2/conf-available/mate-on-web.conf
#     a2enmod headers
#     a2enconf mate-on-web
#     apache2ctl configtest && systemctl reload apache2
<Directory /var/www/html/mate-on-web>
    # No directory listing.
    Options -Indexes
    Require all granted

    # Hardening headers (headers module: a2enmod headers).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    # Content security policy: the site's own scripts and style sheets
    # only, no inline script (the handlers are attached in app.js).
    # connect-src 'self' is needed by the fetch() of puzzle.php, and
    # style-src-attr 'unsafe-inline' by chessboard.js, which sizes the
    # board with style attributes.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"

    # Puzzle data, the Lichess dump and the generation tooling stay next
    # to the code; the browser never requests them: never served.
    <FilesMatch "\.(csv|count|zst|sh|py|md|txt)$">
        Require all denied
    </FilesMatch>

    # A valid request to puzzle.php is a dozen bytes long.
    <Files "puzzle.php">
        LimitRequestBody 4096
    </Files>
</Directory>

# Python environment of the generation tooling: never served.
<Directory /var/www/html/mate-on-web/venv>
    Require all denied
</Directory>

# Git repository of a working clone: history, local branches.
<DirectoryMatch "/\.git(/|$)">
    Require all denied
</DirectoryMatch>
