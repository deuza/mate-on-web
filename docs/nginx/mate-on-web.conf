# Mate On Web under nginx, served in the /mate-on-web/ subdirectory with
# PHP-FPM. To be placed in /etc/nginx/sites-available/ (Debian), or merged
# into the server block that already serves the host (see docs/hardening.md
# when that block also serves Staunton).

server {
    listen 80;
    server_name example.org;

    root /var/www/html;
    index index.php;

    # No directory listing (off by default, restated here), and no nginx
    # version in the headers and error pages.
    autoindex off;
    server_tokens off;

    # No upload anywhere: a valid request to puzzle.php is a dozen bytes.
    client_max_body_size 4k;

    # Declared at server level, and nowhere else: nginx stops inheriting
    # the add_header directives of an upper level as soon as a location
    # declares one. connect-src 'self' is needed by the fetch() of
    # puzzle.php, style-src-attr 'unsafe-inline' by chessboard.js.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Git repository of a working clone: history, local branches.
    location ~ /\.git {
        deny all;
    }

    # Python environment of the generation tooling: never served.
    # ^~ short-circuits the PHP location.
    location ^~ /mate-on-web/venv/ {
        deny all;
    }

    # Puzzle data, the Lichess dump and the generation tooling: never
    # served.
    location ~ ^/mate-on-web/.*\.(csv|count|zst|sh|py|md|txt)$ {
        deny all;
    }

    location ~ \.php$ {
        # Refuse scripts that do not exist rather than hand them over to
        # PHP-FPM.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Debian Trixie: php8.4-fpm. FreeBSD: 127.0.0.1:9000 by default.
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
